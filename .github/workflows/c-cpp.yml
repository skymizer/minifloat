name: C/C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC / Linux / C++17
            os: ubuntu-latest
            standard: 17
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: GCC / Linux / C++20
            os: ubuntu-latest
            standard: 20
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - name: Clang / Linux / C++17
            os: ubuntu-latest
            standard: 17
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Apple Clang / macOS / C++17
            os: macos-latest
            standard: 17
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
          - name: MSVC / Windows / C++17
            os: windows-latest
            standard: 17
            compiler_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          ${{ matrix.compiler_args }}
          -DSKYMIZER_MINIFLOAT_BUILD_TESTS=ON
          -DSKYMIZER_MINIFLOAT_FETCH_GTEST=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSKYMIZER_MINIFLOAT_BUILD_TESTS=ON
          -DSKYMIZER_MINIFLOAT_FETCH_GTEST=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        # The two exhaustive 2**32 pair sweeps are skipped here and nowhere
        # else. ASan and UBSan put them past any sensible gate time: this job
        # took 2583 s on run 32524201635 with them and 98 s on run 32527263942
        # without, against 250 s for the same suite unsanitised on the GCC leg
        # beside it. A gate nobody waits for is not a gate.
        #
        # Little is given up. The sweeps are deterministic and exhaustive, so
        # the other six legs see every pair they would have seen; and the
        # threading they run on -- `find_failing_pair` in `tests/support.hpp`,
        # which is the only part of them a sanitiser has an opinion about --
        # stays under both sanitisers through `Ops.SweepDriverReportsFailures`,
        # an 8-bit sweep of the same driver that finishes in milliseconds.
        env:
          GTEST_FILTER: -Arith.EveryPairMatchesFloatRoundTrip:Ops.EveryPairComparesLikeHost
        run: ctest --test-dir build --output-on-failure

  install-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cmake --install build --prefix "${{ runner.temp }}/minifloat-install"
      - name: Configure consumer
        run: >-
          cmake -S cmake/consumer-test -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/minifloat-install"
      - name: Build consumer
        run: cmake --build consumer-build --parallel
      - name: Test consumer
        run: ctest --test-dir consumer-build --output-on-failure
