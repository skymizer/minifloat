name: Benchmark

on:
  push:
    branches: [main]
  # A pull request builds, runs and validates but does not publish. This job is
  # the only CI that compiles `benches/arith.cpp` at all -- `CMakeLists.txt`
  # enumerates the five test files and nothing under `benches/` -- so without
  # the trigger a break there would first appear on `main`, with the badge
  # already red and no rows published.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded pull request run is worth nothing; a superseded `main` run is
# worth one point of the published series, so only the former is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        # The Makefile recipe stays the source of truth for `-DNDEBUG` and
        # `-I.`; this override exists only to displace `-march=native`. The ISA
        # is pinned because GitHub rotates its runners across CPU generations,
        # and the published series is a trend across commits, not across hosts.
        run: make bench CXXFLAGS='-std=c++17 -O3 -march=x86-64-v3'
      - name: Run
        run: ./bench --json > output.json
      - name: Validate
        # A crashed bench or an emitter bug fails here rather than publishing a
        # truncated series the charts would then carry forever. Parsing alone
        # would not do it: `[]` parses, and an empty array is exactly what both
        # of those leave behind, so the rows are counted and shaped as well.
        run: |
          python3 - <<'PY'
          import json
          rows = json.load(open("output.json"))
          assert len(rows) > 100, f"only {len(rows)} rows"
          assert all(r.keys() == {"name", "unit", "value"} for r in rows)
          print(len(rows), "rows")
          PY
      - name: Publish
        # The dataset is a series over `main`; a pull request has nothing to
        # add to it, and on a fork the token is read-only anyway.
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # The action fetches this branch, it does not create it: the sibling
          # repository's run 32475306070 died on `couldn't find remote ref
          # gh-pages`. It is an orphan branch, empty until the first publish
          # lands `dev/bench/` in it.
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # A shared runner's spread is far wider than the idle box's, and this
          # page is a tripwire, not a gate. Alert loudly, never fail the build.
          alert-threshold: 200%
          comment-on-alert: false
          fail-on-alert: false
